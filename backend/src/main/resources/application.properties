spring.application.name=AP-exams

spring.datasource.url=jdbc:postgresql://localhost:5432/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.access-expiration=15m
jwt.refresh-expiration=7d

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Email Configuration (Hostinger SMTP)
spring.mail.host=smtp.hostinger.com
spring.mail.port=587
spring.mail.username=${HOSTINGER_EMAIL}
spring.mail.password=${HOSTINGER_EMAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender info
spring.mail.from.name=SmashAP

app.frontend.url=${FRONTEND_URL}

# PayPro Global
paypro.checkout.base-url=https://store.payproglobal.com/checkout
paypro.page-template-id=21384
paypro.secret-key=${PAYPRO_SECRET_KEY}
paypro.validation-key=${PAYPRO_VALIDATION_KEY}
paypro.test-mode=${PAYPRO_TEST_MODE:false}

# PayPro Coupons
paypro.coupon.2-products=SMASH2FIVES
paypro.coupon.3-products=SMASH3FIVES
paypro.coupon.4-plus-products=SMASHALL4

# Rate limiting
rate.limit.excluded-paths=/api/v1/public/**,/api/v1/webhooks/**,/actuator/**
rate.limit.trusted-proxies=127.0.0.1,::1

rate.limit.login.capacity=5
rate.limit.login.refill-minutes=15

rate.limit.auth.capacity=10
rate.limit.auth.refill-minutes=5

rate.limit.api.capacity=100
rate.limit.api.refill-minutes=1

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.theme=monokai

# Swagger UI customization
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.defaultModelExpandDepth=1
springdoc.swagger-ui.docExpansion=none

# Exclude paths from documentation
springdoc.paths-to-exclude=/actuator/**, /error

# Logging
# Hibernate SQL
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.example.apexams=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr([%X{requestId}]){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}


# Detailed Security & JWT Logging
logging.level.org.springframework.security=DEBUG
logging.level.org.example.apexams.config.security=DEBUG
logging.level.org.springframework.security.web.FilterChainProxy=DEBUG
logging.level.org.springframework.data.redis=DEBUG

