spring.application.name=AP-exams

spring.datasource.url=jdbc:postgresql://localhost:5432/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

jwt.secret=${JWT_SECRET}
jwt.access-expiration=15m
jwt.refresh-expiration=7d

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.database=0

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL}
sendgrid.from.name=${SENDGRID_FROM_NAME}

app.frontend.url=${FRONTEND_URL}

# LemonSqueezy
lemonsqueezy.api.api-key=${LEMONSQUEEZY_API_KEY}
lemonsqueezy.api.store-id=${LEMONSQUEEZY_STORE_ID}
lemonsqueezy.api.webhook-secret=${LEMONSQUEEZY_WEBHOOK_SECRET}

lemonsqueezy.bundles.variants.2=bundle_2_courses
lemonsqueezy.bundles.variants.3=bundle_3_courses
lemonsqueezy.bundles.variants.4=bundle_4_courses
lemonsqueezy.bundles.variants.5=bundle_5_courses

# Rate limiting
rate.limit.excluded-paths=/api/v1/public/**,/api/v1/webhooks/**,/actuator/**
rate.limit.trusted-proxies=127.0.0.1,::1

rate.limit.login.capacity=5
rate.limit.login.refill-minutes=15

rate.limit.auth.capacity=10
rate.limit.auth.refill-minutes=5

rate.limit.api.capacity=100
rate.limit.api.refill-minutes=1

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.syntaxHighlight.theme=monokai

# Swagger UI customization
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.defaultModelsExpandDepth=1
springdoc.swagger-ui.defaultModelExpandDepth=1
springdoc.swagger-ui.docExpansion=none

# Exclude paths from documentation
springdoc.paths-to-exclude=/actuator/**, /error

# Logging
logging.level.org.example.apexams=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%clr(%d{yyyy-MM-dd HH:mm:ss.SSS}){faint} %clr(${LOG_LEVEL_PATTERN:-%5p}) %clr([%X{requestId}]){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}




